<div class="drawer">
  <div class="drawer-header">
    <h3>O Meu Carrinho</h3>
    <button (click)="onClose.emit()" class="close-btn">✕</button>
  </div>

  <div class="drawer-content">
    @for (item of cartService.items(); track item.product.id) {
      <div class="item">
        <img [src]="item.product.image" [alt]="item.product.title" class="item-img" />
        <div class="item-details">
          <span class="item-title">{{ item.product.title }}</span>
          <span class="item-price">{{ item.product.price | currency:'EUR' }}</span>
          <div class="quantity-controls">
            <button (click)="cartService.updateQuantity(item.product.id, item.quantity - 1)">-</button>
            <span>{{ item.quantity }}</span>
            <button (click)="cartService.updateQuantity(item.product.id, item.quantity + 1)">+</button>
          </div>
        </div>
        <button (click)="cartService.removeFromCart(item.product.id)" class="remove-btn">🗑</button>
      </div>
    } @empty {
      <p class="empty-msg">O carrinho está vazio.</p>
    }
  </div>

  <div class="drawer-footer">
    <div class="total-row">
      <span>Total:</span>
      <strong>{{ cartService.totalPrice() | currency:'EUR' }}</strong>
    </div>
    <button class="checkout-btn" [disabled]="cartService.items().length === 0">
      Finalizar Compra
    </button>
  </div>
</div>
